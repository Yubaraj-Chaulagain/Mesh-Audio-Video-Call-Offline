plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def appVersionCode = project.hasProperty("versionCode") ?
        project.property("versionCode").toInteger() : 1

def appVersionName = project.hasProperty("versionName") ?
        project.property("versionName").toString() : "1.0.1"

android {
    namespace 'com.example.meshcall'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.meshcall'
        minSdk 23
        targetSdk 35

        versionCode appVersionCode
        versionName appVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            debuggable true
        }

        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.0.21'

    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    implementation 'com.quickblox:google-webrtc:1.0.32006'
}
