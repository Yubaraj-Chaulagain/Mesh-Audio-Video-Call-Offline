pluginManagement {
    repositories {
        google()
        mavenCentral()
        // WebRTC artifact mirror (the original Bintray repository is discontinued)
        maven { url 'https://raw.githubusercontent.com/QuickBlox/quickblox-android-sdk-releases/master/' }
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // WebRTC artifact mirror (the original Bintray repository is discontinued)
        maven { url 'https://raw.githubusercontent.com/QuickBlox/quickblox-android-sdk-releases/master/' }
    }
}

rootProject.name = "Mesh-Audio-Video-Call-Offline"

include ':app'
